name: Deploy to Cloud Run

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation (keyless auth)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true

      - name: Run tests (fast gate before deploy)
        run: go build ./...

      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Install migrate
        run: |
          go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: migrate -path migrations -database "$DATABASE_URL" up

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push container
        run: |
          docker build \
            --tag europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/kidsaber/kidsaber-api:latest \
            .
          docker push europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/kidsaber/kidsaber-api:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: kidsaber-api
          region: europe-west1
          image: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/kidsaber/kidsaber-api
          flags: "--allow-unauthenticated"
          env_vars: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            LLM_PROVIDER=${{ secrets.LLM_PROVIDER }}
            LLM_API_KEY=${{ secrets.LLM_API_KEY }}
            LLM_MODEL=${{ secrets.LLM_MODEL }}
            LLM_BASE_URL=${{ secrets.LLM_BASE_URL }}
            NOTIFY_WEBHOOK_URL=${{ secrets.NOTIFY_WEBHOOK_URL }}
            API_KEY=${{ secrets.API_KEY }}
            AUTH_ENABLED=true
            CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}

# ── Required GitHub Actions Secrets ─────────────────────────────────────────
# GCP_PROJECT_ID               — Google Cloud project ID
# GCP_WORKLOAD_IDENTITY_PROVIDER — keyless auth provider
# GCP_SERVICE_ACCOUNT          — service account email for Cloud Run deploy
#
# ── One-time GCP setup (run once before first deploy) ────────────────────────
# gcloud artifacts repositories create kidsaber \
#   --repository-format=docker \
#   --location=europe-west1 \
#   --project=$GCP_PROJECT_ID
#
# gcloud projects add-iam-policy-binding $GCP_PROJECT_ID \
#   --member="serviceAccount:$GCP_SERVICE_ACCOUNT" \
#   --role="roles/artifactregistry.writer"
# DATABASE_URL                 — Neon PostgreSQL (postgres://...?sslmode=require)
# LLM_PROVIDER                 — gemini | groq | ollama
# LLM_API_KEY                  — LLM provider API key
# LLM_MODEL                    — e.g. gemini-2.0-flash-lite
# LLM_BASE_URL                 — e.g. https://generativelanguage.googleapis.com/v1beta/openai/
# NOTIFY_WEBHOOK_URL           — Slack/Discord webhook URL
# API_KEY                      — strong random key sent by the mobile app
# CORS_ALLOWED_ORIGINS         — comma-separated list of allowed origins
