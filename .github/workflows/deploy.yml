name: Deploy to Cloud Run

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation (keyless auth)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - name: Run tests (fast gate before deploy)
        run: go build ./...

      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Install migrate
        run: |
          go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: migrate -path migrations -database "$DATABASE_URL" up

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Images carry the commit SHA as their primary tag so a deployed revision
      # can always be traced back to its source. `latest` is kept as a moving
      # convenience pointer, but deploys reference the immutable SHA tag.
      - name: Build and push API server image
        run: |
          REPO=europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/kidsaber/kidsaber-api
          docker build \
            --build-arg VERSION=${{ github.sha }} \
            --tag "$REPO:${{ github.sha }}" \
            --tag "$REPO:latest" \
            .
          docker push "$REPO:${{ github.sha }}"
          docker push "$REPO:latest"

      - name: Build and push job image
        run: |
          REPO=europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/kidsaber/kidsaber-job
          docker build \
            --file Dockerfile.job \
            --build-arg VERSION=${{ github.sha }} \
            --tag "$REPO:${{ github.sha }}" \
            --tag "$REPO:latest" \
            .
          docker push "$REPO:${{ github.sha }}"
          docker push "$REPO:latest"

      - name: Deploy API server to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: kidsaber-api
          region: europe-west1
          image: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/kidsaber/kidsaber-api:${{ github.sha }}
          flags: "--allow-unauthenticated"
          env_vars: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            LLM_PROVIDER=${{ secrets.LLM_PROVIDER }}
            LLM_API_KEY=${{ secrets.LLM_API_KEY }}
            LLM_MODEL=${{ secrets.LLM_MODEL }}
            LLM_BASE_URL=${{ secrets.LLM_BASE_URL }}
            NOTIFY_WEBHOOK_URL=${{ secrets.NOTIFY_WEBHOOK_URL }}
            API_KEY=${{ secrets.API_KEY }}
            AUTH_ENABLED=true
            FIREBASE_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
            LOG_LEVEL=ERROR

      - name: Deploy question generator Cloud Run Job
        run: |
          gcloud run jobs deploy kidsaber-job \
            --image=europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/kidsaber/kidsaber-job:${{ github.sha }} \
            --region=europe-west1 \
            --task-timeout=3h \
            --max-retries=1 \
            --service-account=${{ secrets.GCP_SERVICE_ACCOUNT }} \
            --set-env-vars="APP_ENV=production,\
          DATABASE_URL=${{ secrets.DATABASE_URL }},\
          LLM_PROVIDER=${{ secrets.LLM_PROVIDER }},\
          LLM_API_KEY=${{ secrets.LLM_API_KEY }},\
          LLM_MODEL=${{ secrets.LLM_MODEL }},\
          LLM_BASE_URL=${{ secrets.LLM_BASE_URL }},\
          NOTIFY_WEBHOOK_URL=${{ secrets.NOTIFY_WEBHOOK_URL }},\
          JOB_BATCH_SIZE=10,\
          JOB_MAX_PER_COMBINATION=100,\
          LOG_LEVEL=ERROR"

      - name: Upsert Cloud Scheduler trigger
        run: |
          if gcloud scheduler jobs describe kidsaber-job-trigger \
              --location=europe-west1 &>/dev/null; then
            gcloud scheduler jobs update http kidsaber-job-trigger \
              --location=europe-west1 \
              --schedule="0 3 * * *" \
              --time-zone="UTC" \
              --uri="https://run.googleapis.com/v2/projects/${{ secrets.GCP_PROJECT_ID }}/locations/europe-west1/jobs/kidsaber-job:run" \
              --message-body="{}" \
              --oauth-service-account-email=${{ secrets.GCP_SERVICE_ACCOUNT }} \
              --attempt-deadline=30m
          else
            gcloud scheduler jobs create http kidsaber-job-trigger \
              --location=europe-west1 \
              --schedule="0 3 * * *" \
              --time-zone="UTC" \
              --uri="https://run.googleapis.com/v2/projects/${{ secrets.GCP_PROJECT_ID }}/locations/europe-west1/jobs/kidsaber-job:run" \
              --message-body="{}" \
              --oauth-service-account-email=${{ secrets.GCP_SERVICE_ACCOUNT }} \
              --attempt-deadline=30m
          fi

# ── Required GitHub Actions Secrets ─────────────────────────────────────────
# GCP_PROJECT_ID               — Google Cloud project ID
# GCP_WORKLOAD_IDENTITY_PROVIDER — keyless auth provider
# GCP_SERVICE_ACCOUNT          — service account email (deploy + Cloud Scheduler invoker)
# DATABASE_URL                 — Neon PostgreSQL (postgres://...?sslmode=require)
# LLM_PROVIDER                 — gemini | groq | ollama
# LLM_API_KEY                  — LLM provider API key
# LLM_MODEL                    — e.g. gemini-2.0-flash-lite
# LLM_BASE_URL                 — e.g. https://generativelanguage.googleapis.com/v1beta/openai/
# NOTIFY_WEBHOOK_URL           — Slack/Discord webhook URL
# API_KEY                      — strong random key for server-to-server and /admin/*
#                                (app clients authenticate with Firebase ID tokens instead)
# CORS_ALLOWED_ORIGINS         — comma-separated browser origins of the web front-end.
#                                Supports https://*.example.com subdomain wildcards.
#                                Cloudflare Pages needs both the production URL and the
#                                preview wildcard, e.g.
#                                https://kidsaber-play.pages.dev,https://*.kidsaber-play.pages.dev
#
# ── One-time GCP setup (run once before first deploy) ────────────────────────
# 1. Artifact Registry
# gcloud artifacts repositories create kidsaber \
#   --repository-format=docker \
#   --location=europe-west1
#
# gcloud projects add-iam-policy-binding $GCP_PROJECT_ID \
#   --member="serviceAccount:$GCP_SERVICE_ACCOUNT" \
#   --role="roles/artifactregistry.writer"
#
# 2. Allow the service account to invoke Cloud Run Jobs (needed by Cloud Scheduler)
# gcloud projects add-iam-policy-binding $GCP_PROJECT_ID \
#   --member="serviceAccount:$GCP_SERVICE_ACCOUNT" \
#   --role="roles/run.invoker"
#
# 3. Allow the service account to manage Cloud Scheduler jobs
# gcloud projects add-iam-policy-binding $GCP_PROJECT_ID \
#   --member="serviceAccount:$GCP_SERVICE_ACCOUNT" \
#   --role="roles/cloudscheduler.admin"
#
# 4. Enable Cloud Scheduler API (if not already enabled)
# gcloud services enable cloudscheduler.googleapis.com --project=$GCP_PROJECT_ID
