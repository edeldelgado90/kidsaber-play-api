name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  ci:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kidsaber_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Install migrate
        run: |
          go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run migrations
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/kidsaber_test?sslmode=disable
        run: migrate -path migrations -database "$DATABASE_URL" up

      - name: go vet
        run: go vet ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/kidsaber_test?sslmode=disable
          AUTH_ENABLED: "false"
          LLM_PROVIDER: gemini
          LLM_MODEL: gemini-2.0-flash-lite
          LLM_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai/
          LLM_API_KEY: ""

      - name: Build server binary
        run: go build ./cmd/server

      - name: Build seed binary
        run: go build ./cmd/seed
